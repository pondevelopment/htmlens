<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLens - Semantic Knowledge Graph Extractor</title>
    <link
        rel="stylesheet"
        href="https://use.typekit.net/poi7egf.css"
        integrity="sha384-oAqMpqX481BWq/0jYaKAEPZ0/CPeoE0uuDoPujcTsqcunWQqHoY5WObZiF0H+Cgt"
        crossorigin="anonymous"
    >
    <style>
        :root {
            --pon-deep-navy: #002c47;
            --pon-brand-blue: #dae7fe;
            --pon-canvas: #ffffff;
            --pon-accent-purple: #b399ff;
            --pon-accent-mint: #52e9c0;
            --pon-text-secondary: #5c7185;
            --pon-hairline: #d1dde8;
            --pon-success: #52e9c0;
            --pon-warning: #f59e0b;
            --pon-error: #ef4444;
            --pon-radius-lg: 20px;
            --pon-radius-md: 12px;
            --pon-radius-sm: 8px;
            --pon-radius-pill: 999px;
            --pon-shadow-1: 0 2px 8px rgba(0, 44, 71, 0.08);
            --pon-shadow-2: 0 4px 16px rgba(0, 44, 71, 0.14);
            /* Spacing scale (4px base) for consistent rhythm */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 24px;
            --space-6: 32px;
            --space-7: 48px;
            --space-8: 64px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        /* Pon Datalab design system */
        body { 
            font-family: 'PT Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--pon-canvas);
            color: var(--pon-deep-navy);
            min-height: 100dvh; 
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        .container { max-width: 1120px; margin: 0 auto; padding: 0 var(--space-5); }
        
        header { 
            text-align: center; 
            padding: var(--space-8) var(--space-5) var(--space-6);
            background: var(--pon-brand-blue);
            border-bottom: 1px solid var(--pon-hairline);
            border-radius: 0 0 var(--pon-radius-lg) var(--pon-radius-lg);
            margin-bottom: var(--space-6);
            position: relative;
        }

        button.theme-toggle {
            position: absolute;
            top: var(--space-4);
            right: var(--space-5);
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid var(--pon-hairline);
            border-radius: var(--pon-radius-pill);
            background: var(--pon-canvas);
            color: var(--pon-deep-navy);
            font-family: 'PT Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        button.theme-toggle:hover {
            background: #f0f4f8;
            border-color: var(--pon-accent-purple);
            transform: translateY(-1px);
        }

        button.theme-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 44, 71, 0.12);
        }
        
        h1 { 
            font-family: 'PT Serif', serif;
            font-size: clamp(2.6rem, 5vw, 5rem);
            margin-bottom: var(--space-3);
            color: var(--pon-deep-navy);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.05;
            text-wrap: balance;
        }
        
        .tagline { 
            font-size: 1.125rem;
            color: var(--pon-text-secondary);
            font-weight: 400;
            line-height: 1.5;
            max-width: 44ch;
            margin: 0 auto;
            text-wrap: pretty;
        }
        
        .card { 
            background: var(--pon-canvas);
            border-radius: var(--pon-radius-lg);
            padding: var(--space-6); 
            box-shadow: var(--pon-shadow-1);
            margin-bottom: var(--space-6);
            border: 1px solid var(--pon-hairline);
        }
        
        .input-section { margin-bottom: var(--space-5); }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: var(--space-2); 
            color: var(--pon-deep-navy);
            font-size: 15px;
        }
        
        input[type="url"] { 
            width: 100%; 
            padding: 14px 18px; 
            background: var(--pon-canvas);
            border: 1.5px solid var(--pon-hairline);
            border-radius: var(--pon-radius-md);
            font-size: 16px;
            color: var(--pon-deep-navy);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        input[type="url"]:focus { 
            outline: none; 
            border-color: var(--pon-deep-navy);
            background: var(--pon-canvas);
            box-shadow: 0 0 0 4px rgba(0,44,71,0.12);
        }
        
        input[type="url"]::placeholder { color: var(--pon-text-secondary); }
        
        .examples-section { margin-bottom: var(--space-5); padding-top: var(--space-2); }
        .example-buttons { display: flex; gap: var(--space-2); flex-wrap: wrap; }
        
        .example-btn { 
            flex: 0 1 auto; 
            padding: 8px 16px; 
            font-size: 14px; 
            font-weight: 500; 
            background: var(--pon-brand-blue);
            color: var(--pon-deep-navy);
            border: 1px solid var(--pon-hairline);
            border-radius: var(--pon-radius-pill);
            cursor: pointer; 
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        
        .example-btn:hover { 
            background: rgba(179, 153, 255, 0.18);
            border-color: var(--pon-accent-purple);
            transform: translateY(-1px); 
        }
        
        .button-group { display: flex; gap: var(--space-3); margin-top: var(--space-5); align-items: center; flex-wrap: wrap; }
        .bypass-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.9em; color: var(--pon-text-secondary); cursor: pointer; user-select: none; }
        .bypass-toggle input { cursor: pointer; }
        .bypass-inline { display: flex; justify-content: flex-end; margin-top: var(--space-2); color: var(--pon-text-secondary); }
        .stats-strip { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin: 0 0 var(--space-4); padding: var(--space-3) var(--space-4); background: #f0f4f8; border: 1px solid var(--pon-hairline); border-radius: var(--pon-radius-md); }
        .stat { display: flex; flex-direction: column; line-height: 1.15; min-width: 60px; }
        .stat.muted .stat-num { color: var(--pon-text-secondary); }
        .stat-num { font-size: 1.35em; font-weight: 600; }
        .stat-lbl { font-size: 0.72em; color: var(--pon-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; white-space: nowrap; }
        .stat-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
        .stat-chips.empty { color: var(--pon-text-secondary); font-style: italic; font-size: 0.85em; }
        .stat-chip { display: inline-block; padding: 2px 8px; background: rgba(179, 153, 255, 0.14); color: var(--pon-deep-navy); border-radius: var(--pon-radius-lg); font-size: 0.78em; font-weight: 500; border: 1px solid rgba(179, 153, 255, 0.35); }
        .stat-chip.more { background: #f0f4f8; color: var(--pon-text-secondary); border-color: var(--pon-hairline); }
        .emerging-standards { margin: 28px 0; padding: 16px 20px; background: var(--pon-brand-blue); border: 1px solid var(--pon-hairline); border-radius: var(--pon-radius-lg); color: var(--pon-deep-navy); }
        .emerging-standards h4 { margin: 0 0 6px; color: var(--pon-deep-navy); }
        .emerging-standards > p { color: var(--pon-text-secondary) !important; }
        .es-block { margin: 12px 0; padding: 0; background: var(--pon-canvas); border: 1px solid var(--pon-hairline); border-radius: var(--pon-radius-md); font-size: 0.9em; }
        .es-block > summary > strong { color: var(--pon-deep-navy); }
        .es-preview { color: var(--pon-text-secondary); font-size: 0.9em; margin-left: 4px; }
        .es-spec { margin-left: auto; font-size: 0.78em; font-weight: 600; color: var(--pon-deep-navy); text-decoration: none; padding: 3px 10px; border: 1px solid var(--pon-hairline); border-radius: var(--pon-radius-pill); white-space: nowrap; transition: background 0.2s ease, border-color 0.2s ease; }
        .es-spec:hover { background: #f0f4f8; border-color: var(--pon-accent-purple); }
        .es-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; padding: 3px 0; line-height: 1.4; }
        .es-row .es-label { color: var(--pon-text-secondary); font-weight: 500; }
        .es-row .es-val { word-break: break-word; color: var(--pon-deep-navy); }
        .es-row .es-val code { background: #f0f4f8; padding: 1px 5px; border-radius: 3px; font-size: 0.92em; }
        .es-row .es-val a { color: var(--pon-deep-navy); text-decoration: underline; text-underline-offset: 2px; }
        .es-row .es-hint { grid-column: 2; color: var(--pon-text-secondary); font-size: 0.85em; }
        
        button { 
            flex: 1; 
            padding: 15px 28px; 
            font-family: 'PT Sans', sans-serif;
            font-size: 15px;
            font-weight: 600; 
            border: none; 
            border-radius: var(--pon-radius-md);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 44, 71, 0.12);
        }
        
        .btn-primary { 
            background: var(--pon-accent-mint);
            color: var(--pon-deep-navy);
            box-shadow: var(--pon-shadow-1);
        }
        
        .btn-primary:hover:not(:disabled) { 
            transform: translateY(-1px);
            box-shadow: var(--pon-shadow-2);
        }
        
        .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: var(--pon-shadow-1); }
        
        .btn-secondary { 
            background: var(--pon-canvas);
            color: var(--pon-deep-navy);
            border: 1.5px solid var(--pon-deep-navy);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #f0f4f8;
            color: var(--pon-deep-navy);
        }
        
        .btn-secondary:active:not(:disabled) { transform: translateY(1px); }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .loading { display: none; text-align: center; padding: var(--space-6); }
        .loading.active { display: block; }
        
        .spinner { 
            border: 3px solid rgba(0, 44, 71, 0.12); 
            border-top: 3px solid var(--pon-accent-mint); 
            border-radius: 50%; 
            width: 48px; 
            height: 48px; 
            animation: spin 0.8s linear infinite; 
            margin: 0 auto var(--space-4); 
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .results { display: none; }
        .results.active { display: block; margin-top: var(--space-4); }
        
        /* Modern tabs */
        .tabs { 
            display: flex; 
            gap: var(--space-1); 
            margin-bottom: var(--space-5); 
            background: #f0f4f8;
            padding: var(--space-1);
            border-radius: var(--pon-radius-md);
            overflow-x: auto;
            border: 1px solid var(--pon-hairline);
        }
        
        .tab { 
            padding: 11px 22px; 
            background: transparent;
            border: 1px solid transparent; 
            border-radius: var(--pon-radius-sm);
            cursor: pointer; 
            font-weight: 600; 
            color: var(--pon-text-secondary);
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }
        
        .tab:hover { 
            background: var(--pon-canvas);
            color: var(--pon-deep-navy);
        }
        
        .tab.active { 
            background: var(--pon-canvas);
            color: var(--pon-deep-navy);
            border: 1px solid var(--pon-hairline);
            box-shadow: var(--pon-shadow-1);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Code output styling */
        .json-output, .markdown-output { 
            background: #f0f4f8;
            border: 1px solid var(--pon-hairline);
            border-radius: var(--pon-radius-lg);
            padding: 20px; 
            overflow-x: auto; 
            max-height: 600px; 
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace; 
            font-size: 13px; 
            line-height: 1.6;
            white-space: pre;
            color: var(--pon-deep-navy);
        }
        
        .json-output .json-key { color: var(--pon-deep-navy); }
        .json-output .json-string { color: #1f6f67; }
        .json-output .json-number { color: #184f80; }
        .json-output .json-boolean { color: #7152c7; }
        .json-output .json-null { color: var(--pon-text-secondary); }
        
        .markdown-output table { 
            border-collapse: collapse; 
            margin: 10px 0; 
            width: auto; 
            background: rgba(255,255,255,0.03);
        }
        
        .markdown-output th, .markdown-output td { 
            border: 1px solid var(--pon-hairline);
            padding: 10px 14px; 
            text-align: left; 
        }
        
        .markdown-output th { 
            background: var(--pon-brand-blue);
            color: var(--pon-deep-navy);
            font-weight: 600; 
        }
        
        .markdown-output tr:nth-child(even) { background: #f7f9fc; }
        .markdown-output hr { border: none; border-top: 1px solid var(--pon-hairline); margin: 20px 0; }
        
        .error { 
            background: rgba(239, 68, 68, 0.08);
            border: 2px solid rgba(239, 68, 68, 0.25);
            border-radius: var(--pon-radius-lg);
            padding: 18px; 
            color: var(--pon-error);
            margin-top: 20px; 
            display: none; 
        }
        
        /* Modern Insights styles */
        .insights-container { 
            max-height: none; 
        }
        
        .status-badge { 
            display: inline-block; 
            padding: 10px 20px; 
            border-radius: 24px; 
            font-weight: 600; 
            font-size: 14px; 
            margin-bottom: 24px;
            border: 1px solid;
        }
        
        .status-excellent { background: rgba(126,231,135,0.12); color: #7ee787; border-color: rgba(126,231,135,0.3); }
        .status-good { background: rgba(0,212,255,0.12); color: #00d4ff; border-color: rgba(0,212,255,0.3); }
        .status-needs-attention { background: rgba(255,166,87,0.12); color: #ffa657; border-color: rgba(255,166,87,0.3); }
        .status-critical { background: rgba(255,107,107,0.12); color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
        
        .insight-section { margin-bottom: 28px; }
        
        .insight-header { 
            font-size: 18px; 
            font-weight: 700; 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            color: #e4e6eb;
        }
        
        .insight-card { 
            background: rgba(255,255,255,0.03);
            border-left: 4px solid; 
            padding: 18px; 
            margin-bottom: 14px; 
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        
        .insight-card:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(4px);
        }
        
        .insight-card.critical { border-left-color: #ff6b6b; background: rgba(255,107,107,0.08); }
        .insight-card.high { border-left-color: #ffa657; background: rgba(255,166,87,0.08); }
        .insight-card.recommended { border-left-color: #00d4ff; background: rgba(0,212,255,0.08); }
        .insight-card.optional { border-left-color: #8b92a7; background: rgba(139,146,167,0.08); }
        
        .insight-title { font-weight: 600; margin-bottom: 8px; color: #e4e6eb; font-size: 15px; }
        .insight-why { color: #8b92a7; font-size: 14px; margin-bottom: 10px; line-height: 1.6; }
        .insight-why a { color: #00d4ff; text-decoration: none; transition: color 0.2s; }
        .insight-why a:hover { color: #00b8e6; text-decoration: underline; }
        
        .insight-fix { 
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08); 
            padding: 12px; 
            border-radius: 8px; 
            font-family: 'SF Mono', Monaco, monospace; 
            font-size: 13px; 
            margin-top: 10px;
            color: #7ee787;
        }
        
        .insight-impact { color: #00d4ff; font-size: 13px; font-style: italic; margin-top: 8px; }
        
        .insight-reference { font-size: 12px; margin-top: 10px; }
        .insight-reference a { color: #00d4ff; text-decoration: none; transition: color 0.2s; }
        .insight-reference a:hover { color: #00b8e6; text-decoration: underline; }
        
        .strengths-list { list-style: none; padding: 0; }
        .strengths-list li { 
            padding: 12px 16px; 
            background: rgba(126,231,135,0.08);
            border-radius: 8px; 
            margin-bottom: 10px; 
            color: #7ee787;
            border-left: 3px solid #7ee787;
        }
        
        .rich-results { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
        
        .rich-result { 
            padding: 10px 16px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500;
            border: 1px solid;
        }
        
        .rich-result.eligible { background: rgba(126,231,135,0.12); color: #7ee787; border-color: rgba(126,231,135,0.3); }
        .rich-result.partial { background: rgba(255,166,87,0.12); color: #ffa657; border-color: rgba(255,166,87,0.3); }
        .rich-result.not-eligible { background: rgba(255,107,107,0.12); color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
        
        /* Modern AI Readiness Styles */
        .ai-readiness-container { padding: 20px; }
        .ai-readiness-container h2 { color: #00d4ff; margin-bottom: 12px; font-weight: 700; }
        .ai-readiness-container p { color: #8b92a7; line-height: 1.7; }
        
        .well-known-checks, .ai-plugin-status, .mcp-status, .openapi-status, .robots-txt-status, .llms-txt-status, .security-txt-status { 
            background: rgba(255,255,255,0.03);
            padding: 24px; 
            border-radius: 12px; 
            margin: 24px 0; 
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .well-known-checks h4, .ai-plugin-status h4, .mcp-status h4, .openapi-status h4, .robots-txt-status h4, .llms-txt-status h4, .security-txt-status h4 { 
            margin-top: 0; 
            color: #e4e6eb; 
            font-size: 18px; 
            margin-bottom: 18px;
            font-weight: 600;
        }
        
        .file-checks { margin-top: 12px; }
        
        .file-check { 
            padding: 0; 
            margin: 12px 0; 
            background: rgba(255,255,255,0.03);
            border-radius: var(--pon-radius-md); 
            font-size: 14px; 
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 3px solid rgba(255,255,255,0.08);
            color: #c7c9d3;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        /* Collapsible <details> styling - closed when OK, open when there's something to investigate. */
        details.file-check > summary,
        details.es-block > summary {
            list-style: none;
            cursor: pointer;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        details.file-check > summary::-webkit-details-marker,
        details.es-block > summary::-webkit-details-marker { display: none; }
        details.file-check > summary::before,
        details.es-block > summary::before {
            content: '';
            display: inline-block;
            flex-shrink: 0;
            width: 7px;
            height: 7px;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(-45deg);
            opacity: 0.45;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }
        details.file-check[open] > summary::before,
        details.es-block[open] > summary::before { transform: rotate(45deg); opacity: 0.7; }
        details.file-check > summary:hover::before,
        details.es-block > summary:hover::before { opacity: 0.9; }
        details.file-check > summary:hover,
        details.es-block > summary:hover { background: rgba(255,255,255,0.04); }
        details.file-check > summary { border-radius: var(--pon-radius-md); }
        details.file-check[open] > summary {
            margin-bottom: 10px;
            border-radius: var(--pon-radius-md) var(--pon-radius-md) 0 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        details.file-check > *:not(summary) { padding: 0 16px 16px; }
        details.es-block > *:not(summary) { padding: 0 12px 10px 12px; }

        /* Callout boxes inside a file-check keep their own padding and inset from
           the card edges. Without this, the generic child-padding rule above
           flattens their top padding (text sticks to the top) and pushes them
           edge-to-edge. */
        details.file-check > .impact-box,
        details.file-check > .benefit-box,
        details.file-check > .explainer-box {
            margin: 2px 16px 14px;
            padding: 13px 15px;
        }

        /* File-check header: caret, status icon, title, right-aligned status pill. */
        details.file-check > summary { padding: 14px 16px; gap: 11px; }
        .file-check .fc-icon { font-size: 15px; line-height: 1; flex-shrink: 0; }
        .file-check .fc-title { flex: 1; min-width: 0; font-size: 14px; }
        .file-check .fc-title strong { font-weight: 600; }
        .file-check .fc-status {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 11px;
            border-radius: var(--pon-radius-pill);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            font-variant-numeric: tabular-nums;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .file-check .fc-status .fc-code { opacity: 0.72; font-weight: 500; }
        .file-check .fc-status.found   { background: rgba(82,233,192,0.16); color: #0f7a63; border-color: rgba(21,128,61,0.30); }

        /* Top-level status cards converted to <details> by JS. */
        details.card-collapsible > summary {
            list-style: none;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 12px;
        }
        details.card-collapsible > summary::-webkit-details-marker { display: none; }
        details.card-collapsible > summary > h3,
        details.card-collapsible > summary > h4 { margin: 0; flex: 1; }
        details.card-collapsible > summary::before {
            content: '▸';
            font-size: 0.85em;
            opacity: 0.6;
            transition: transform 0.15s ease;
            width: 14px;
            display: inline-block;
        }
        details.card-collapsible[open] > summary::before { transform: rotate(90deg); }
        details.card-collapsible > summary:hover::before { opacity: 1; }

        /* At-a-glance status pill on collapsed cards. */
        .card-status { margin-left: auto; display: inline-flex; align-items: center; }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 3px 10px;

            letter-spacing: 0.02em;

        .status-pill .pill-ok + .pill-bad { padding-left: 8px; border-left: 1px solid currentColor; }

        /* Left accent on the card itself so the row is scannable in the list. */
        details.card-collapsible.is-ok    { border-left: 3px solid rgba(126,231,135,0.55); }
        details.card-collapsible.has-issue { border-left: 3px solid rgba(255,107,107,0.65); }

<body>
    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch theme">Dark mode</button>
            <h1>HTMLens</h1>
            <p class="tagline">Analyze your website and reveal AI readiness and structured data in seconds</p>
        </header>
        <div class="card">
            <div class="input-section">
                <label for="urlInput">Enter a URL to analyze:</label>
                <input type="url" id="urlInput" placeholder="https://example.com" value="https://schema.org" />
                <label class="bypass-toggle bypass-inline" title="Results are cached at the Cloudflare edge for 5-15 minutes to reduce load on the target site. Tick this to force a fresh fetch of every file.">
                    <input type="checkbox" id="bypassCache" />
                    <span>Bypass cache</span>
                </label>
            </div>
            <div class="examples-section">
                <label>Try these examples:</label>
                <div class="example-buttons">
                    <button class="example-btn" data-url="https://kalkhoff-bikes.com/nl_nl/image-5-advance-blx">Kalkhoff Bike</button>
                    <button class="example-btn" data-url="https://schema.org">Schema.org</button>
                    <button class="example-btn" data-url="https://www.gazelle.nl">Gazelle</button>
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" id="analyzeBtn">Analyze</button>
                <button class="btn-secondary" id="shareBtn">Share</button>
                <button class="btn-secondary" id="downloadBtn" disabled title="Run an analysis first">Download report</button>
                <button class="btn-secondary" id="clearBtn">Clear</button>
            </div>
            <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing webpage...</p></div>
            <div class="results" id="results">
                <div class="tabs">
                    <button class="tab active" data-tab="insights"><span class="tab-text">Insights</span></button>
                    <button class="tab" data-tab="ai-readiness"><span class="tab-text">AI Readiness</span></button>
                    <button class="tab" data-tab="jsonld"><span class="tab-text">JSON-LD</span></button>
                    <button class="tab" data-tab="structured"><span class="tab-text">Structured Data</span></button>
                    <button class="tab" data-tab="page"><span class="tab-text">Page Content</span></button>
                </div>
                <div class="tab-content active" id="insights-content">
                    <div id="insightsOutput"></div>
                </div>
                <div class="tab-content" id="ai-readiness-content">
                    <div id="aiReadinessOutput"></div>
                </div>
                <div class="tab-content" id="jsonld-content">
                    <div class="json-output" id="jsonldOutput"></div>
                </div>
                <div class="tab-content" id="structured-content">
                    <div class="markdown-output" id="structuredOutput"></div>
                </div>
                <div class="tab-content" id="page-content">
                    <div class="markdown-output" id="pageOutput"></div>
                </div>
            </div>
            <div class="error" id="error"><div id="errorMessage"></div></div>
        </div>
        <footer>
            <p>Powered by <a href="https://github.com/pondevelopment/htmlens">htmlens</a> • Rust + Cloudflare Workers</p>
            <p>Developed by Pon Datalab</p>
        </footer>
    </div>
    <script>
        const API_BASE = "${origin}";
        const THEME_STORAGE_KEY = 'htmlens-theme';

        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function updateThemeToggle(theme) {
            const toggle = document.getElementById('themeToggle');
            if (!toggle) return;
            const nextTheme = theme === 'dark' ? 'light' : 'dark';
            toggle.textContent = nextTheme === 'dark' ? 'Dark mode' : 'Light mode';
            toggle.setAttribute('aria-pressed', String(theme === 'dark'));
            toggle.setAttribute('aria-label', `Switch to ${nextTheme} mode`);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeToggle(theme);
        }

        function initializeTheme() {
            const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            const initialTheme = storedTheme === 'dark' || storedTheme === 'light'
                ? storedTheme
                : getSystemTheme();
            applyTheme(initialTheme);

            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            const syncSystemTheme = event => {
                if (!localStorage.getItem(THEME_STORAGE_KEY)) {
                    applyTheme(event.matches ? 'dark' : 'light');
                }
            };
            if (typeof mediaQuery.addEventListener === 'function') {
                mediaQuery.addEventListener('change', syncSystemTheme);
            } else if (typeof mediaQuery.addListener === 'function') {
                mediaQuery.addListener(syncSystemTheme);
            }
        }

        initializeTheme();

        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
            applyTheme(nextTheme);
        });
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(targetTab + '-content').classList.add('active');
            });
        });
        
        document.getElementById('analyzeBtn').addEventListener('click', analyze);
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                analyze();
            }
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('urlInput').value = '';
            document.getElementById('results').classList.remove('active');
            document.getElementById('error').style.display = 'none';
            window.__lastAnalysis = null;
            const dlBtn = document.getElementById('downloadBtn');
            dlBtn.disabled = true;
            dlBtn.title = 'Run an analysis first';
        });
        document.getElementById('shareBtn').addEventListener('click', () => {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) { 
                showError('Please enter a URL to share'); 
                return; 
            }
            
            // Create shareable URL with the analyzed URL as query parameter
            const shareUrl = window.location.origin + window.location.pathname + '?url=' + encodeURIComponent(url);
            
            // Copy to clipboard
            navigator.clipboard.writeText(shareUrl).then(() => {
                // Show success feedback
                const btn = document.getElementById('shareBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = 'Copied';
                btn.style.background = '#52e9c0';
                btn.style.color = '#002c47';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(err => {
                showError('Failed to copy to clipboard: ' + err.message);
            });
        });

        // Download full report as Markdown ----------------------------------
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const data = window.__lastAnalysis;
            if (!data) { showError('Run an analysis first'); return; }
            const md = buildReportMarkdown(data);
            const slug = (data.url || 'report')
                .replace(/^https?:\/\//, '')
                .replace(/[^a-z0-9]+/gi, '_')
                .replace(/^_+|_+$/g, '')
                .slice(0, 80) || 'report';
            const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `htmlens_${slug}_${stamp}.md`;
            document.body.appendChild(link);
            link.click();
            setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 0);
        });

        // Convert rendered DOM to readable plain-text markdown. Preserves
        // headings, list items, and table-like row structure with reasonable
        // fidelity by walking the node tree.
        function domToMarkdown(root) {
            if (!root) return '';
            const out = [];
            const walk = (node, depth) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    const t = node.textContent.replace(/\s+/g, ' ');
                    if (t.trim()) out.push(t);
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const tag = node.tagName.toLowerCase();
                if (tag === 'script' || tag === 'style') return;

                const block = ['div','section','article','header','footer','p','li','tr','summary','details','h1','h2','h3','h4','h5','h6'].includes(tag);
                const startLen = out.length;

                if (/^h[1-6]$/.test(tag)) {
                    out.push('\n\n' + '#'.repeat(parseInt(tag[1], 10) + 1) + ' ');
                } else if (tag === 'li') {
                    out.push('\n- ');
                } else if (tag === 'strong' || tag === 'b') {
                    out.push('**');
                } else if (tag === 'em' || tag === 'i') {
                    out.push('_');
                } else if (tag === 'code') {
                    out.push('`');
                } else if (tag === 'br') {
                    out.push('\n');
                    return;
                } else if (tag === 'a') {
                    const href = node.getAttribute('href');
                    if (href && !href.startsWith('#')) {
                        const txt = node.textContent.trim();
                        out.push(`[${txt}](${href})`);
                        return;
                    }
                }

                node.childNodes.forEach(c => walk(c, depth + 1));

                if (tag === 'strong' || tag === 'b') out.push('**');
                else if (tag === 'em' || tag === 'i') out.push('_');
                else if (tag === 'code') out.push('`');

                if (block && out.length > startLen) out.push('\n');
            };
            walk(root, 0);
            return out.join('')
                .replace(/[ \t]+\n/g, '\n')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        function buildReportMarkdown(data) {
            const lines = [];

            lines.push(`- **Generated:** ${now}`);

                lines.push(`- **Entities:** ${data._stats.entityCount} · **JSON-LD blocks:** ${data._stats.jsonldCount} · **HTML chars:** ${data._stats.htmlLength.toLocaleString()}`);
            }
            lines.push('');

            // Insights
            lines.push('## Insights');
            lines.push('');
            lines.push(domToMarkdown(document.getElementById('insightsOutput')) || '_No insights rendered._');
            lines.push('');

            // AI Readiness
            lines.push('## AI Readiness');
            lines.push('');
            lines.push(domToMarkdown(document.getElementById('aiReadinessOutput')) || '_No AI readiness data._');
            lines.push('');

            // JSON-LD (raw graph)
            lines.push('## JSON-LD');
            lines.push('');
            lines.push('```json');
            try {
                lines.push(JSON.stringify(data.jsonldGraph ?? data.jsonld ?? {}, null, 2));
            } catch (_) {
                lines.push('// (failed to serialize JSON-LD)');
            }
            lines.push('```');
            lines.push('');

            // Structured Data (server-rendered markdown tables)
            lines.push('## Structured Data');
            lines.push('');
            lines.push((data.markdown || '').trim() || '_No structured data found._');
            lines.push('');

            // Page Content
            lines.push('## Page Content');
            lines.push('');
            lines.push((data.pageMarkdown || '').trim() || '_No page content extracted._');
            lines.push('');

            return lines.join('\n');

        async function analyze() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) { showError('Please enter a URL'); return; }
            
            document.getElementById('error').style.display = 'none';
            document.getElementById('results').classList.remove('active');
            document.getElementById('loading').classList.add('active');
            document.getElementById('analyzeBtn').disabled = true;
            
            try {
                const bypass = document.getElementById('bypassCache')?.checked ? '&nocache=1' : '';
                console.log('Fetching:', API_BASE + '/api?url=' + encodeURIComponent(url) + bypass);
                const response = await fetch(API_BASE + '/api?url=' + encodeURIComponent(url) + bypass);
                console.log('Response status:', response.status, response.statusText);
                
                if (!response.ok) {
                    let errorMessage = 'Failed to analyze';
                    try {
                        const errorData = await response.json();
                        console.log('Error data:', errorData);
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        console.error('Failed to parse error JSON:', e);
                        // If JSON parsing fails, use default error
                        errorMessage = `HTTP ${response.status}: ${response.statusText}`;
                    }
                    throw new Error(errorMessage);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                // Validate required fields
                if (!data.url || !data.graph || !data.jsonld) {
                    throw new Error('Invalid response structure from API');
                }
                
                // Compute lightweight stats once and attach to data for renderInsights.
                const entityTypes = data.graph.nodes
                    ? [...new Set(data.graph.nodes.flatMap(n => n.types || []))]
                    : [];
                function countEntities(items) {
                    let count = 0;
                    if (!Array.isArray(items)) return 0;
                    items.forEach(item => {
                        if (item && typeof item === 'object') {
                            if (item['@type']) count++;
                            if (Array.isArray(item['@graph'])) {
                                count += countEntities(item['@graph']);
                            }
                        }
                    });
                    return count;
                }
                data._stats = {
                    entityTypes,
                    entityCount: countEntities(data.jsonld),
                    htmlLength: data.meta?.htmlLength || 0,
                    jsonldCount: Array.isArray(data.jsonld) ? data.jsonld.length : 0,
                };
                
                    // Update JSON-LD tab with combined @graph structure and syntax highlighting
                    document.getElementById('jsonldOutput').innerHTML = syntaxHighlight(data.jsonldGraph);
                
                // Convert markdown tables to HTML for better display
                let structuredHtml = formatMarkdownTables(data.markdown);
                
                // Add FAQ rendering if FAQPage schema is present
                const faqHtml = renderFAQSchema(data.jsonld);
                if (faqHtml) {
                    structuredHtml += faqHtml;
                }
                
                document.getElementById('structuredOutput').innerHTML = structuredHtml;
                document.getElementById('pageOutput').textContent = data.pageMarkdown;
                
                // Render insights
                renderInsights(data);
                
                // Render AI readiness
                if (data.aiReadiness) {
                    renderAiReadinessTab(data.url, data.aiReadiness);
                }
                
                document.getElementById('results').classList.add('active');

                // Stash for download report + enable the button.
                window.__lastAnalysis = data;
                const dlBtn = document.getElementById('downloadBtn');
                dlBtn.disabled = false;
                dlBtn.title = 'Download full report as Markdown';
            } catch (error) {
                console.error('Analysis error:', error);
                showError(error.message || 'An unexpected error occurred');
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }
